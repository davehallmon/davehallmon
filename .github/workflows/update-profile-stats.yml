name: Update profile stats

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate OCCAMI profile stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=davehallmon
            &custom_title=Building%20in%20public
            &show_icons=true
            &hide_rank=true
            &include_all_commits=true
            &show=all_time_contribs
            &contribs_include_own_repos=true
            &title_color=F2501D
            &icon_color=F2501D
            &bg_color=00000000
            &text_color_light=24292F
            &text_color_dark=F0F6FC
            &hide_border=true
            &border_radius=2
            &disable_animations=true
            &number_format=long
            &card_width=760
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update profile stats"
          git push
